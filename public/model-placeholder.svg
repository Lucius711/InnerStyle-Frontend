<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2a3145"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </radialGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cubeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b45c7"/>
      <stop offset="100%" stop-color="#1a9fb5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#3b4256" stroke-width="1" opacity="0.25">
    <path d="M0 300 L400 300 M0 340 L400 340 M0 380 L400 380"/>
    <path d="M80 280 L60 400 M200 280 L200 400 M320 280 L340 400"/>
  </g>

  <!-- isometric cube -->
  <g transform="translate(200 190)">
    <!-- top face -->
    <path d="M0 -78 L78 -33 L0 12 L-78 -33 Z" fill="url(#cube)" opacity="0.95"/>
    <!-- left face -->
    <path d="M-78 -33 L0 12 L0 100 L-78 55 Z" fill="url(#cubeDark)" opacity="0.9"/>
    <!-- right face -->
    <path d="M78 -33 L0 12 L0 100 L78 55 Z" fill="url(#cube)" opacity="0.7"/>
    <!-- edges -->
    <path d="M0 -78 L78 -33 L0 12 L-78 -33 Z M-78 -33 L-78 55 L0 100 L0 12 M78 -33 L78 55 L0 100"
          fill="none" stroke="#e9ecff" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <text x="200" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="18" font-weight="600" fill="#8b93a7" letter-spacing="0.5">3D model</text>
</svg>
